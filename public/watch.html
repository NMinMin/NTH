<!doctype html>
<html lang="vi">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="robots" content="noindex, nofollow">
 <meta name="referrer" content="no-referrer">
 <title>Video được chia sẻ | NTH Video</title>
 <link rel="stylesheet" href="/style.css">
 <script defer src="/video-quality.js"></script>
 <script defer src="/watch.js"></script>
</head>
<body class="watch-page">
 <main class="watch-shell">
  <a class="brand" href="/">◈ NTH<span>VIDEO</span></a>
  <h1 id="watchTitle">Video được chia sẻ</h1>
  <nav id="sharedFolderFiles" aria-label="Video trong thư mục" hidden></nav>
  <h2 id="sharedVideoTitle" hidden></h2>
  <video id="sharedPlayer" controls playsinline preload="metadata" hidden></video>
  <p id="watchStatus" role="status">Đang mở video…</p>
  <a id="sharedDownload" class="primary" download hidden>Tải bản gốc</a>
 </main>
</body>
</html>
